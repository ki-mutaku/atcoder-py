[project]
name = "atcoder-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "takuya", email = "e245745@ie.u-ryukyu.ac.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "ac-library-python>=0.1.0",
    "bitarray>=3.12.3",
    "gmpy2>=2.3.2",
    "more-itertools>=11.2.1",
    "mpmath>=1.3.0",
    "networkx>=3.7",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pulp>=4.2.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "sortedcontainers>=2.4.0",
    "sympy>=1.14.0",
]

[project.scripts]
atcoder-py = "atcoder_py:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
